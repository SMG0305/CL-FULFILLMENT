<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0A0E1A" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230A0E1A'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial Black,Helvetica,sans-serif' font-weight='900' font-size='13' fill='%2322D3EE'%3ECL%3C/text%3E%3C/svg%3E" />
  <title>Page Not Found — CL Fulfillment</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0A0E1A; --surface: #1A2236;
      --border: rgba(99,179,237,0.12); --border2: rgba(99,179,237,0.22);
      --blue: #3B82F6; --blue-bright: #60A5FA; --cyan: #22D3EE;
      --text: #E2E8F0; --text-dim: #8899AA; --white: #F8FAFC;
    }
    body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    nav { position: relative; z-index: 2; display: flex; align-items: center; padding: 1.2rem 4rem; border-bottom: 1px solid var(--border); }
    .nav-logo { font-size: 1.1rem; font-weight: 800; color: var(--white); text-decoration: none; white-space: nowrap; }
    .nav-logo span { color: var(--cyan); }
    main { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4rem 1.5rem 6rem; }
    main::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 760px; height: 420px; max-width: 100%; background: radial-gradient(ellipse, rgba(59,130,246,0.08) 0%, transparent 65%); pointer-events: none; }
    .code { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cyan); margin-bottom: 1.4rem; display: flex; align-items: center; gap: 0.8rem; }
    .code::before { content: ''; width: 28px; height: 1px; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
    h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; line-height: 1.1; color: var(--white); letter-spacing: -0.02em; margin-bottom: 1.1rem; }
    p { font-size: 0.98rem; line-height: 1.75; color: var(--text-dim); max-width: 460px; margin-bottom: 2.4rem; }
    .actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .btn-primary { background: var(--blue); color: var(--white); text-decoration: none; padding: 0.9rem 1.7rem; border-radius: 6px; font-size: 0.9rem; font-weight: 600; box-shadow: 0 0 20px rgba(59,130,246,0.3); transition: background 0.2s; }
    .btn-primary:hover { background: var(--blue-bright); }
    .btn-ghost { background: transparent; color: var(--text); text-decoration: none; padding: 0.9rem 1.7rem; border: 1px solid var(--border2); border-radius: 6px; font-size: 0.9rem; font-weight: 500; transition: border-color 0.2s, color 0.2s; }
    .btn-ghost:hover { border-color: var(--blue-bright); color: var(--white); }
    footer { position: relative; z-index: 1; border-top: 1px solid var(--border); padding: 1.6rem 4rem; text-align: center; }
    footer p { font-size: 0.78rem; color: var(--text-dim); margin: 0; max-width: none; }
    @media(max-width:700px){ nav{padding:1rem 1.4rem;} footer{padding:1.4rem 1.4rem;} }
  </style>
</head>
<body>
  <nav><a class="nav-logo" href="/"><span>CL</span> Fulfillment</a></nav>
  <main>
    <p class="code">Error 404</p>
    <h1>This page doesn&rsquo;t exist.</h1>
    <p>The link may be out of date, or the address may have a typo in it. Everything on this site lives on one page &mdash; head back and you&rsquo;ll find what you were looking for.</p>
    <div class="actions">
      <a href="/" class="btn-primary">Back to Home</a>
      <a href="/#contact" class="btn-ghost">Get in Touch</a>
    </div>
  </main>
  <footer><p>&copy; 2026 Capital Freight-US. All rights reserved.</p></footer>
</body>
</html>
